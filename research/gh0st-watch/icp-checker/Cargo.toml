[package]
name = "watch_checker"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "=0.10.35"
ic-cdk = "=0.20.2"
serde = { version = "1", features = ["derive"] }
revm = { version = "=19.7.0", default-features = false, features = ["portable"] }
