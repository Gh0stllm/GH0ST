[package]
name = "watch_checker"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "=0.10.35"
ic-cdk = "=0.20.2"
ic-http-certification = "=4.0.1"
ic-asset-certification = "=4.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
revm = { version = "=19.7.0", default-features = false, features = ["portable"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
