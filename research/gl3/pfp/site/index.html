<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e0d">
  <meta name="description" content="Compose and generate native 64×64 scenes on Robinhood Chain.">
  <title>GH0ST Image Studio</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./studio.mjs"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="https://gh0st.fyi/" aria-label="GH0ST">
      <span class="brand-icon" aria-hidden="true">[··]</span> GH0ST
    </a>
    <nav aria-label="Network">
      <a href="https://robin.etherscan.io/">Explorer</a>
      <a href="https://github.com/Gh0stllm/GH0ST/tree/research/GH0ST-L3-GL3/research/gl3/pfp/scene-decoder/v3">Source</a>
    </nav>
  </header>
  <main>
    <h1>Image Studio<span>.</span></h1>
    <p class="intro">Compose a scene and run the 500 KB model on Robinhood Chain.</p>
    <div class="studio">
      <section class="viewer" aria-label="Image preview">
        <div class="display">
          <div class="rail"><span id="image-subject">IMAGE</span><span>64 × 64</span></div>
          <div class="artboard">
            <canvas id="avatar" width="512" height="512" role="img" aria-label="64 by 64 generated pixel image"></canvas>
          </div>
          <div class="rail"><span id="image-source">PREVIEW</span><span id="style-code"></span></div>
        </div>
        <div class="exports">
          <button type="button" id="download" disabled>Download PNG</button>
          <button type="button" id="share" disabled>Copy parameters</button>
        </div>
        <a id="proof" class="proof" hidden target="_blank" rel="noopener noreferrer">View transaction</a>
      </section>
      <form class="controls" id="generator">
        <fieldset>
          <legend>Scene</legend>
          <div class="traits">
            <label class="trait">Subject<select id="subject" name="subject"></select></label>
            <label class="trait">Tint<select id="tint" name="tint"></select></label>
            <label class="trait">Layout<select id="relation" name="relation"></select></label>
            <label class="trait">Background<select id="background" name="background"></select></label>
            <label class="trait" id="second-subject">Second subject<select id="subject-b" name="subject-b"></select></label>
            <label class="trait" id="second-tint">Second tint<select id="tint-b" name="tint-b"></select></label>
            <label class="trait">Style<select id="style" name="style"></select></label>
            <label class="trait">Palette<select id="palette" name="palette"></select></label>
          </div>
        </fieldset>
        <label class="field seed-label" for="seed">Seed</label>
        <div class="seed-row">
          <input id="seed" name="seed" type="text" inputmode="numeric" maxlength="20" value="64312" spellcheck="false" required>
          <button id="random" type="button">Random seed</button>
        </div>
        <button id="generate" class="primary" type="submit" disabled>Preview on Robinhood</button>
        <button id="record" class="record" type="button" disabled>Record on Robinhood</button>
        <p id="status" role="status" aria-live="polite">Checking generator…</p>
      </form>
    </div>
  </main>
</body>
</html>
