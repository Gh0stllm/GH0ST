[package]
name = "gh0st-chess-hybrid-relay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
canister = ["dep:ic-cdk", "dep:ic-cdk-timers", "dep:ic-stable-structures", "dep:ic-management-canister-types"]

[dependencies]
gh0st-chess-hybrid-brain = { path = "../hybrid-brain" }
candid = "=0.10.40"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
rlp = "=0.5.2"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "alloc"] }
ic-cdk = { version = "=0.20.3", optional = true }
ic-cdk-timers = { version = "=1.0.0", optional = true }
ic-stable-structures = { version = "=0.7.2", optional = true }
ic-management-canister-types = { version = "=0.3.3", optional = true }

[[example]]
name = "export_candid"
required-features = ["canister"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
