[package]
name = "gh0st-icp-coordinator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "=0.10.20"
ic-cdk = "=0.18.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
hex = "0.4"
ethabi = { version = "18", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
