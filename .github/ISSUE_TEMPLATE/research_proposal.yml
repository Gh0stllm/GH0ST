name: Research proposal
description: Propose an experiment, alternative runtime or new validation study.
title: "[Research] "
body:
  - type: textarea
    id: question
    attributes:
      label: Research question
      description: What hypothesis would you like to investigate?
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Proposed experiment
      description: Describe the baseline, candidate, workload, tooling and comparisons.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Prerequisites and assumptions
      description: Include chain features, execution environment, model/export pins or required artifacts. State whether prerequisites are available.
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: Which measurements would support or reject the hypothesis? Separate deployment, inference, quality and budget metrics.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Prior work or initial results
      description: Link relevant source, papers, experiments or reports. Distinguish measured results from projections.
