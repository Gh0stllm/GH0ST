[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gh0st-s0ul"
version = "0.1.0"
description = "S0UL-1M: a purpose-trained small agent language model research implementation"
requires-python = ">=3.11"
dependencies = ["torch==2.5.1", "numpy==2.3.5"]

[tool.setuptools.packages.find]
include = ["s0ul*"]
