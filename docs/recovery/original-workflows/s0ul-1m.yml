name: S0UL-1M research checks

on:
  push:
    branches: [research/GH0ST-S0UL-1M]
    paths: ["s0ul-1m/s0ul/**", "s0ul-1m/tests/**", "s0ul-1m/configs/**", "s0ul-1m/contracts/**", "s0ul-1m/pyproject.toml", "s0ul-1m/requirements.txt", "s0ul-1m/package*.json", ".github/workflows/s0ul-1m.yml"]
  pull_request:
    paths: ["s0ul-1m/s0ul/**", "s0ul-1m/tests/**", "s0ul-1m/configs/**", "s0ul-1m/contracts/**", "s0ul-1m/pyproject.toml", "s0ul-1m/requirements.txt", "s0ul-1m/package*.json", ".github/workflows/s0ul-1m.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: s0ul-1m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Python model, data and export checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reproduce dataset
        run: python -m s0ul.data --output data --seed 42
      - name: Install pinned contract tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Local EVM contract checks
        run: npm test
      - name: Reproduce supervised research pilot
        if: github.event_name == 'workflow_dispatch'
        run: python -m s0ul.train --data data --output runs/ci-pilot --steps 1200 --batch-size 32 --threads 2 --seed 42 --eval-every 100 --learning-rate 0.001
      - name: Evaluate frozen checkpoint
        if: github.event_name == 'workflow_dispatch'
        run: python -m s0ul.evaluate --checkpoint runs/ci-pilot/checkpoint.pt --data data --split test --output runs/ci-pilot/test-generation.json --threads 2
      - name: Export and verify numeric candidates
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m s0ul.export --checkpoint runs/ci-pilot/checkpoint.pt --output exports/ci-pilot
          python -m s0ul.export --verify exports/ci-pilot/manifest.json
          python -m s0ul.integer --checkpoint runs/ci-pilot/checkpoint.pt --output exports/integer-ci-pilot
      - name: Preserve research checkpoint and reports
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: s0ul-1m-research-pilot-${{ github.sha }}
          path: |
            s0ul-1m/runs/ci-pilot/
            s0ul-1m/exports/ci-pilot/
            s0ul-1m/exports/integer-ci-pilot/
            s0ul-1m/data/manifest.json
            s0ul-1m/reports/evm-kernel.json
          retention-days: 30
